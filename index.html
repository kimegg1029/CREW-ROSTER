<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CREW ROSTER">
  <title>CREW ROSTER</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/style.css?v=9">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><div class="eyebrow">EASTAR CREW</div><h1>CREW ROSTER</h1></div>
      <button id="themeButton" class="icon-button" aria-label="테마 변경">◐</button>
    </header>
    <section class="month-heading">
      <button id="prevMonth" class="month-arrow" aria-label="이전 달">‹</button>
      <div><div id="monthLabel" class="month-label"></div><div id="eventCount" class="month-subtitle"></div></div>
      <button id="nextMonth" class="month-arrow" aria-label="다음 달">›</button>
    </section>
    <section class="roster-wrap" aria-label="월간 승무원 근무표">
      <table class="roster-table">
        <thead><tr><th>날짜</th><th>요일</th><th>편명 / 일정</th><th>Show-up</th></tr></thead>
        <tbody id="rosterBody"></tbody>
      </table>
    </section>
    <div class="legend" aria-label="근무 배경색 안내">
      <span><i style="--dot:#e46b68"></i>비행</span>
      <span><i style="--dot:#8c9bd8"></i>해외체류</span>
      <span><i style="--dot:#63a78c"></i>휴무</span>
      <span><i style="--dot:#d5a34d"></i>기타</span>
    </div>
    <div class="main-actions"><button id="photoImportButton" class="photo-button" type="button">사진에서 가져오기</button><button id="addButton" class="add-button"><span>＋</span> 일정 추가</button></div>
    <nav class="bottom-nav"><span class="active">근무표</span><span id="backupButton" role="button" tabindex="0">백업</span><span id="settingsButton" role="button" tabindex="0">설정</span></nav>
  </main>
  <dialog id="eventDialog" class="event-dialog">
    <form id="eventForm">
      <div class="dialog-head"><h2 id="dialogTitle">일정 추가</h2><button type="button" id="closeDialog" class="icon-button">×</button></div>
      <label>근무 유형
        <select id="eventType">
          <option value="flight">비행</option><option value="NS">해외체류</option><option value="DO">휴무</option>
          <option value="RDO">지정 OFF</option><option value="PV">생리휴가</option><option value="SANLV">본사 교육</option>
          <option value="STBY">본사대기</option><option value="DH">항공이동</option><option value="personal">개인 일정</option><option value="unknown">미확인</option>
        </select>
      </label>
      <label>편명 / 일정명<input id="eventTitle" maxlength="60" placeholder="예: ZE611" required></label>
      <label id="showUpField">Show-up 시간<input id="showUpTime" type="time"></label>
      <div class="date-row"><label>시작일<input id="startDate" type="date" required></label><label>종료일<input id="endDate" type="date" required></label></div>
      <label>메모<input id="eventNote" maxlength="160" placeholder="선택 입력"></label>
      <label>배경색<input id="eventColor" type="color" value="#e46b68"></label>
      <div class="form-actions"><button type="button" id="deleteEvent" class="delete-button" hidden>삭제</button><button type="submit" class="save-button">저장</button></div>
    </form>
  </dialog>
  <dialog id="photoDialog" class="event-dialog photo-dialog">
    <div class="dialog-head"><h2>근무표 사진 가져오기</h2><button type="button" id="closePhotoDialog" class="icon-button">×</button></div>
    <p class="photo-help">근무표 사진을 선택하면 기기 안에서 글자를 인식해. 인식 결과는 틀릴 수 있으니 저장 전에 꼭 확인해 줘.</p>
    <label class="photo-pick">사진 선택<input id="rosterPhoto" type="file" accept="image/*" capture="environment"></label>
    <img id="photoPreview" class="photo-preview" alt="선택한 근무표 사진 미리보기" hidden>
    <label>근무표 월<input id="photoMonth" type="month"></label>
    <div id="ocrStatus" class="ocr-status" aria-live="polite">사진을 선택해 줘.</div>
    <button id="runOcrButton" class="save-button photo-action" type="button" disabled>사진 글자 인식하기</button>
    <label>인식된 원문<textarea id="ocrText" rows="5" placeholder="사진을 인식하면 결과가 여기에 표시돼."></textarea></label>
    <p class="photo-help">아래 일정 후보는 한 줄에 하나씩 <b>날짜 | 유형 | 편명/일정 | Show-up</b> 순서야. 잘못 인식된 내용은 직접 수정해 줘.</p>
    <label>가져올 일정 후보<textarea id="importRows" rows="6" placeholder="2026-11-17 | flight | ZE611 | 08:30&#10;2026-11-18 | NS | 해외체류 |"></textarea></label>
    <div class="form-actions"><button id="closePhotoDialogBottom" class="delete-button" type="button">취소</button><button id="savePhotoRows" class="save-button" type="button">확인 후 일정 등록</button></div>
  </dialog>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="./js/app.js?v=10"></script>
</body>
</html>
